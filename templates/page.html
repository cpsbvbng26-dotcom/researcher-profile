{{JSONLD}}<meta name="theme-color" content="#faf9f7">
<style>
:root {
  --bg: #faf9f7;
  --card: #ffffff;
  --text: #17171a;
  --muted: #63636b;
  --faint: #727278;
  --line: #e6e4df;
  --line-soft: #efedE9;
  --accent: #8a6a3d;
  --accent-soft: rgba(138, 106, 61, .10);
  --accent-wash: rgba(138, 106, 61, .07);   /* 銘板の上にかかる刷毛。装飾のみ */
  --wall: #221f26;                          /* 城壁の石。火を遮るので不透明 */
  --ember: rgba(118, 20, 14, .78);          /* 狭間から漏れる火 */
  --wall-bg: rgba(28, 26, 30, .06);
  --stone: rgba(23, 23, 26, .30);           /* 石の継ぎ目 */
  --sky: rgba(126, 158, 190, .20);          /* 城の上の空 */
  --void: rgba(126, 158, 190, .13);         /* 城の下の空。基壇が途切れた先 */
  --header-bg: rgba(250, 249, 247, .86);
  --shadow: 0 18px 40px -28px rgba(23, 23, 26, .45);
}

:root[data-theme="dark"] {
  --bg: #121214;
  --card: #191919;
  --text: #ececee;
  --muted: #9c9ca4;
  --faint: #81818b;
  --line: #2a2a2d;
  --line-soft: #232326;
  --accent: #b08d57;
  --accent-soft: rgba(176, 141, 87, .14);
  --accent-wash: rgba(176, 141, 87, .10);   /* 銘板の上にかかる刷毛。装飾のみ */
  --wall: #08070a;
  --ember: rgba(232, 74, 42, .62);
  --wall-bg: rgba(0, 0, 0, .35);
  --stone: rgba(236, 236, 238, .16);
  --sky: rgba(58, 84, 122, .34);            /* 城の上の空 */
  --void: rgba(58, 84, 122, .22);           /* 城の下の空。基壇が途切れた先 */
  --header-bg: rgba(18, 18, 20, .86);
  --shadow: 0 18px 40px -28px rgba(0, 0, 0, .8);
}

html { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }

body {
  margin: 0;
  /* 城の上の空。頁の天から下へ薄れる。城壁はこの中に浮いている。 */
  background:
    linear-gradient(to bottom, var(--sky) 0, transparent 26rem),
    var(--bg);
  background-repeat: no-repeat, repeat;
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s, color .25s;
}

.serif {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  font-feature-settings: "palt" 1;
}

.wrap { max-width: 54rem; margin: 0 auto; padding: 0 1.5rem; }

a { color: inherit; }

/* ---------- ヘッダー ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--header-bg);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

/* 頭上から牙が下りている —— 落とし格子の内側。 */
header::after {
  content: ""; display: block; height: 13px;
  background-image:
    conic-gradient(from 225deg at 50% 100%, var(--wall) 0 90deg, transparent 0),
    linear-gradient(to bottom, var(--ember) 0%, transparent 76%);
  background-size: 24px 13px, 100% 100%;
  background-position: 0 0, 0 0;
  background-repeat: repeat-x, no-repeat;
}
.head-row {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding-top: 1rem; padding-bottom: 1rem;
}
.mark {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.05rem; letter-spacing: .16em; color: var(--accent);
  text-decoration: none;
}
.nav { display: flex; align-items: center; gap: 1.5rem; }
.nav a {
  font-size: .82rem; color: var(--muted); text-decoration: none;
  letter-spacing: .04em; white-space: nowrap;
  transition: color .15s;
}
.nav a:hover { color: var(--text); }

.theme-toggle {
  width: 2rem; height: 2rem; flex: none;
  display: grid; place-items: center;
  font: inherit; font-size: .9rem; line-height: 1; cursor: pointer;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: color .15s, border-color .15s, background-color .15s;
}
.theme-toggle:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

/* ---------- ヒーロー ---------- */
.hero { padding: 6rem 0 4rem; }
.eyebrow {
  font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 1.5rem;
}
.hero h1 {
  margin: 0 0 .5rem;
  font-size: clamp(2.4rem, 7vw, 3.6rem);
  font-weight: 600; letter-spacing: .04em; line-height: 1.3;
}
.hero .romaji {
  margin: 0 0 .9rem;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem; letter-spacing: .22em; color: var(--faint);
}

.ident { margin: 0 0 2rem; font-size: .8rem; letter-spacing: .04em; }
.ident .label {
  font-family: Georgia, serif;
  letter-spacing: .18em; color: var(--accent);
  margin-right: .7rem;
}
.ident a {
  color: var(--muted); text-decoration: none;
  border-bottom: 1px solid var(--line);
  transition: color .15s, border-color .15s;
}
.ident a:hover { color: var(--accent); border-color: var(--accent); }

.hero p.lead {
  margin: 0; max-width: 34rem;
  color: var(--muted); font-size: 1rem;
}

/* ---------- 事実の欄 ----------
   ヒーローで、数えられる事実と、著者自身の解釈を分けて置く。
   混ぜると、どちらも検証できないものになる。 */
.facts { margin: 1.8rem 0 0; max-width: 38rem; display: grid; gap: 0; }
.facts .fact {
  display: grid; grid-template-columns: 5.5rem 1fr; gap: 1rem;
  padding: .55rem 0; border-bottom: 1px solid var(--line-soft);
}
.facts dt { margin: 0; font-size: .74rem; letter-spacing: .1em; color: var(--faint); padding-top: .2rem; }
.facts dd { margin: 0; font-size: .86rem; line-height: 1.85; color: var(--muted); }
.facts dd b { color: var(--text); }
.facts dd a { color: var(--accent); }
.facts .faint { color: var(--faint); }

/* ---------- 主張 ----------
   一つだけ出す。反証の手順まで書いていなければ、主張ではなく宣伝である。 */
.claim {
  max-width: 42rem;
  padding: 1.5rem 1.6rem;
  background: var(--wall-bg);
  border-left: 3px solid var(--ember);
  border-radius: 0 .5rem .5rem 0;
}
.claim-what { margin: 0 0 1.4rem; font-size: .95rem; line-height: 1.95; }
.claim-what code, .claim-kv code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .92em; color: var(--text);
}
.claim-kv { margin: 0; display: grid; gap: 0; }
.claim-kv > div {
  display: grid; grid-template-columns: 9rem 1fr; gap: 1rem;
  padding: .75rem 0; border-top: 1px solid var(--line);
}
.claim-kv dt { margin: 0; font-size: .76rem; letter-spacing: .08em; color: var(--faint); padding-top: .25rem; }
.claim-kv dd { margin: 0; font-size: .85rem; line-height: 1.9; color: var(--muted); }
.claim-kv dd b { color: var(--text); }
.claim-kv dd a { color: var(--accent); }
.claim-kv dd .faint { color: var(--faint); }
.claim-foot {
  margin: 1.3rem 0 0; padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: .82rem; line-height: 1.85; color: var(--faint);
}

@media (max-width: 40rem) {
  .facts .fact, .claim-kv > div { grid-template-columns: 1fr; gap: .15rem; }
}

/* ---------- 自己紹介の板 ----------
   石垣に嵌めた銘板のつもりで組む。左に指し色の細い縁、上に薄い刷毛。
   来た道は縦の道筋で、いまいる位置だけ塗りつぶす。
   色は指し色（--accent）だけを使い、新しい本文色を作らない。 */
.profile {
  max-width: 42rem;
  margin: 2rem 0 2.2rem;
  padding: 1.35rem 1.5rem 1.45rem;
  background:
    linear-gradient(to bottom, var(--accent-wash) 0, transparent 5rem),
    var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 .5rem .5rem 0;
  box-shadow: var(--shadow);
}
.profile-label, .aims-label {
  margin: 0 0 .7rem;
  font-size: .7rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint);
}
.profile-now {
  margin: 0; font-size: .95rem; line-height: 1.95; color: var(--text);
}

/* 来た道。縦の線を左に一本引き、節ごとに丸を置く。 */
.path {
  list-style: none;
  margin: 1.25rem 0 0; padding: 0 0 0 1.15rem;
  border-left: 1px solid var(--line);
}
.path li {
  position: relative;
  display: grid; grid-template-columns: 1fr auto; gap: .5rem 1rem;
  align-items: baseline;
  padding: .55rem 0;
}
.path li + li { border-top: 1px solid var(--line-soft); }
.path li::before {
  content: ""; position: absolute;
  left: -1.15rem; top: 1.05rem;
  width: .42rem; height: .42rem; margin-left: -.22rem;
  border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.path .path-now::before {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 0 0 .22rem var(--accent-soft);
}
.path-name { font-size: .88rem; line-height: 1.7; color: var(--text); }
.path-now .path-name { color: var(--accent); }
.path-state {
  font-size: .76rem; letter-spacing: .04em; color: var(--muted);
  white-space: nowrap;
}

/* これからの二つ。数ではなく並びで見せる。 */
.aims-label { margin: 1.5rem 0 .6rem; }
.aims { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.aims li {
  position: relative; padding-left: 1.15rem;
  font-size: .88rem; line-height: 1.85; color: var(--muted);
}
.aims li::before {
  content: ""; position: absolute; left: 0; top: .72rem;
  width: .5rem; height: 1px; background: var(--accent);
}

@media (max-width: 40rem) {
  .profile { padding: 1.15rem 1.15rem 1.25rem; }
  .path li { grid-template-columns: 1fr; gap: .1rem; }
  .path-state { white-space: normal; }
}

/* ---------- ノートへの導線 ----------
   核に置かなかったものは、消さずにここから辿れる。 */
.notes-list { max-width: 42rem; }
.notes-list p {
  margin: 0; padding: .85rem 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: .88rem; line-height: 1.8;
}
.notes-list a { color: var(--accent); text-decoration: none; }
.notes-list a:hover { text-decoration: underline; }
.notes-list span {
  display: block; margin-top: .15rem;
  font-size: .78rem; color: var(--faint);
}

/* 仕切りは胸壁 —— 狭間を切った上端と壁体。石は不透明で火を遮り、
   狭間の隙間からだけ下の火が漏れる。画像は使わない。 */
.rule {
  height: 34px; margin: 0; border: 0;
  background-image:
    repeating-linear-gradient(90deg, var(--wall) 0 27px, transparent 27px 52px),
    linear-gradient(var(--wall), var(--wall)),
    linear-gradient(to bottom, var(--ember) 0%, var(--ember) 46%, transparent 74%);
  background-size: 52px 22px, 100% 12px, 100% 100%;
  background-position: 0 0, 0 22px, 0 0;
  background-repeat: repeat-x, repeat-x, no-repeat;
}

/* 基壇の下端。石が不揃いに途切れ、その先には何も無い ―― 城は浮いている。
   牙（落とし格子）と同じ形を下向きに使い、周期をずらして割付けを崩す。 */
footer::after {
  content: ""; display: block; height: 30px;
  background-image:
    conic-gradient(from 45deg at 50% 0%, var(--stone) 0 90deg, transparent 0),
    conic-gradient(from 45deg at 50% 0%, var(--stone) 0 90deg, transparent 0),
    linear-gradient(to bottom, var(--void) 0%, transparent 82%);
  background-size: 38px 17px, 61px 30px, 100% 100%;
  background-position: 0 0, 19px 0, 0 0;
  background-repeat: repeat-x, repeat-x, no-repeat;
}

/* ---------- セクション ---------- */
section.block { padding: 4.5rem 0; }
.sec-head { margin-bottom: 2.5rem; }
.sec-head h2 {
  margin: 0 0 .4rem;
  font-size: 1.4rem; font-weight: 600; letter-spacing: .06em;
}
.sec-head p { margin: 0; font-size: .85rem; color: var(--faint); }

/* ---------- 修了証 ---------- */
.group + .group { margin-top: 2.5rem; }
.group-name {
  display: flex; align-items: center; gap: .9rem;
  font-size: .74rem; letter-spacing: .2em; color: var(--faint);
  text-transform: uppercase;
  margin-bottom: 1.1rem;
}
.group-name::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }

.cert {
  display: flex; flex-direction: column; gap: .55rem;
  padding: 1.5rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: .9rem;
  text-decoration: none;
  transition: transform .2s, border-color .2s, box-shadow .2s;
}
.cert:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: var(--shadow);
}
.cert .code {
  font-family: Georgia, serif;
  font-size: .7rem; letter-spacing: .14em; color: var(--accent);
}
.cert h3 {
  margin: 0; font-size: 1.02rem; font-weight: 600; line-height: 1.6;
  letter-spacing: .01em;
}
.cert .issuer { font-size: .8rem; color: var(--muted); margin: 0; }
.cert .alt {
  margin: 0;
  font-size: .76rem; line-height: 1.7; color: var(--faint);
}
.cert .when {
  margin: 0;
  font-family: Georgia, serif;
  font-size: .74rem; letter-spacing: .1em; color: var(--faint);
}
.cert .doi {
  margin: 0;
  font-family: Georgia, serif;
  font-size: .72rem; letter-spacing: .08em;
  color: var(--accent);
}

.sec-head .go {
  display: inline-block; margin-left: .6rem;
  font-size: .8rem; color: var(--accent); text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color .15s;
}
.sec-head .go:hover { border-bottom-color: var(--accent); }
.sec-head .go::after { content: " →"; }

.cert .verify {
  margin-top: .35rem;
  font-size: .74rem; letter-spacing: .06em; color: var(--faint);
  transition: color .2s;
}
.cert:hover .verify { color: var(--accent); }
.cert .verify::after { content: " →"; }

/* ---------- 学習領域 ---------- */
.areas { display: grid; gap: 0; }
.area {
  display: grid; gap: .3rem 2rem;
  grid-template-columns: 1fr;
  padding: 1.5rem 0;
  border-top: 1px solid var(--line-soft);
}
.area:last-child { border-bottom: 1px solid var(--line-soft); }
@media (min-width: 40rem) { .area { grid-template-columns: 13rem 1fr; } }
.area h3 { margin: 0; font-size: .95rem; font-weight: 600; letter-spacing: .04em; }
.area p { margin: 0; font-size: .9rem; color: var(--muted); }

/* ---------- リンク ---------- */
.links { display: flex; flex-wrap: wrap; gap: .75rem; }
.link {
  display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: .2rem .6rem;
  max-width: 100%;
  padding: .7rem 1.4rem;
  font-size: .88rem; text-decoration: none;
  border: 1px solid var(--line); border-radius: 999px;
  transition: border-color .2s, background-color .2s;
}
.link:hover { border-color: var(--accent); background: var(--accent-soft); }
.link span { font-size: .72rem; color: var(--faint); letter-spacing: .08em; }

/* ---------- フッター ---------- */
footer { border-top: 1px solid var(--line); margin-top: 2rem; position: relative; }

/* 基壇の粗い石積み。火は狭間と牙だけに置き、ここは石だけで重くする。
   上下の段を半分ずらし、周期の違う三枚目を重ねて割付けの規則性を崩す。 */
footer::before {
  content: ""; display: block; height: 46px;
  background-image:
    repeating-linear-gradient(90deg, var(--stone) 0 2px, transparent 2px 68px),
    repeating-linear-gradient(90deg, var(--stone) 0 2px, transparent 2px 68px),
    repeating-linear-gradient(90deg, var(--stone) 0 2px, transparent 2px 109px),
    linear-gradient(var(--stone), var(--stone)),
    linear-gradient(to bottom, var(--wall-bg), transparent 70%);
  background-size: 68px 23px, 68px 23px, 109px 46px, 100% 2px, 100% 100%;
  background-position: 0 0, 34px 23px, 19px 0, 0 22px, 0 0;
  background-repeat: repeat-x, repeat-x, repeat-x, repeat-x, no-repeat;
}
.foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 2.5rem 0;
  font-size: .74rem; color: var(--faint);
}
.built-with {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .35rem .85rem;
  font-size: .72rem; color: var(--muted); text-decoration: none;
  border: 1px solid var(--line); border-radius: 999px;
  transition: border-color .15s, color .15s, background-color .15s;
}
.built-with:hover { color: var(--text); border-color: #d97757; background: rgba(217, 119, 87, .08); }
.built-with .dot { width: .45rem; height: .45rem; flex: none; border-radius: 50%; background: #d97757; }

/* Grok の表示。以前は theme.js が実行時に <style> を注入していたが、
   CSP の style-src が動的な <style> を拒むため、ここに置く。 */
.built-with.grok:hover { border-color: #4b5563; background: rgba(75, 85, 99, .08); }
.built-with.grok .dot { background: #4b5563; }
.built-with-row { display: inline-flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

/* ---------- 登場演出 ---------- */
.reveal {
  opacity: 0; transform: translateY(12px);
  transition: opacity .7s cubic-bezier(.22, .68, .28, 1), transform .7s cubic-bezier(.22, .68, .28, 1);
  transition-delay: calc(var(--i, 0) * 70ms);
}
.reveal.is-visible { opacity: 1; transform: none; }

/* 登場の時間差。以前は JS で --i を書き込んでいたが、CSP の style-src が
   インラインの style 適用を拒むため、CSS だけで与える。JS も一つ減る。 */
.cards > *:nth-child(1), .areas > *:nth-child(1) { --i: 0; }
.cards > *:nth-child(2), .areas > *:nth-child(2) { --i: 1; }
.cards > *:nth-child(3), .areas > *:nth-child(3) { --i: 2; }
.cards > *:nth-child(4), .areas > *:nth-child(4) { --i: 3; }
.cards > *:nth-child(5), .areas > *:nth-child(5) { --i: 4; }
.cards > *:nth-child(6), .areas > *:nth-child(6) { --i: 5; }
.cards > *:nth-child(7), .areas > *:nth-child(7) { --i: 6; }
.cards > *:nth-child(8), .areas > *:nth-child(8) { --i: 7; }
.cards > *:nth-child(9), .areas > *:nth-child(9) { --i: 8; }
.cards > *:nth-child(10), .areas > *:nth-child(10) { --i: 9; }
.cards > *:nth-child(11), .areas > *:nth-child(11) { --i: 10; }
.cards > *:nth-child(12), .areas > *:nth-child(12) { --i: 11; }


:where(a, button, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: .3rem;
}

.skip-link {
  position: absolute; left: 1rem; top: -3rem; z-index: 50;
  padding: .55rem 1rem;
  color: var(--bg); background: var(--text);
  text-decoration: none; font-size: .82rem;
  border-radius: .5rem;
  transition: top .15s;
}
.skip-link:focus { top: 1rem; }

/* 項目が 1 行に収まらない幅では、ナビを折り返して見切れを防ぐ */
@media (max-width: 30rem) {
  .head-row { flex-wrap: wrap; align-items: flex-start; row-gap: .55rem; }
  .nav { width: 100%; flex-wrap: wrap; justify-content: flex-start; gap: .95rem; }
  .nav a { font-size: .76rem; }
  .wrap { padding: 0 1.1rem; }
}

@media (max-width: 22rem) {
  .nav { gap: .7rem; }
  .nav a { font-size: .72rem; letter-spacing: 0; }
  .wrap { padding: 0 .9rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; transform: none; }
  .cert:hover { transform: none; }
}

@media print {
  @page { margin: 16mm; }
  header, footer, .theme-toggle, .skip-link { display: none !important; }
  body { background: #fff; color: #000; }
  .cert { break-inside: avoid; border-color: #ccc; box-shadow: none; }
  .reveal { opacity: 1; transform: none; }
}

/* リンクは色だけで示さない。指し色と本文色の差はどう選んでも 1.2:1 程度にしか
   ならず（3:1 必要）、色覚や低コントラストの環境では見分けがつかない。下線で示す。 */
.facts dd a, .claim-kv dd a, .notes-list a, .prose a, .lead-block a,
.lead a, .issuer a, .sec-head p a { text-decoration: underline; text-underline-offset: .15em; }
.facts dd a:hover, .claim-kv dd a:hover, .notes-list a:hover,
.prose a:hover, .lead-block a:hover, .lead a:hover { text-decoration-thickness: 2px; }

/* 同じ資料の別の所在。DOI の下に一行で並べる。 */
/* カードの外に出したので .cert の子孫ではない。単独のクラスで指定する。 */
.where {
  margin: .2rem 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .72rem; line-height: 1.7; letter-spacing: .01em; color: var(--faint);
}

/* 所在の行はカードの外に置く（<a> の入れ子は作れないため）。
   カードのすぐ下に、同じ幅で続けて見えるようにする。 */
.cert-group { display: flex; flex-direction: column; gap: .35rem; }
.cert-group .cert { flex: 1; }
.cert-group .where { padding: 0 .35rem; }
.cert-group .where a { color: var(--faint); }
.cert-group .where a { text-decoration: underline; text-underline-offset: .15em; }
.cert-group .where a:hover { color: var(--accent); }
</style>
</head>
<body>

<a class="skip-link" href="#main">{{SKIP}}</a>

<header>
  <div class="wrap head-row">
    <a class="mark serif" href="#main">{{INITIALS}}</a>
    <nav class="nav">
{{NAV}}
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="{{THEME_TOGGLE}}">&#9790;</button>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">

  <section class="wrap hero">
    <p class="eyebrow reveal">{{EYEBROW}}</p>
    <h1 class="serif reveal">{{NAME}}</h1>
{{NAME_LATIN}}
{{IDENTIFIERS}}
{{PROFILE}}{{TAGLINE}}
  </section>
{{SECTIONS}}
</main>

<footer>
  <div class="wrap foot">
    <span>{{FOOTER}}</span>
    <span>Built with <a href="https://github.com/cpsbvbng26-dotcom/researcher-profile">researcher-profile</a></span>
  </div>
</footer>

<script>
(function () {
  'use strict';

  /* ---------- テーマ ---------- */
  var KEY = 'researcher-profile-theme';
  var root = document.documentElement;

  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function system() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function current() { return root.getAttribute('data-theme') || stored() || system(); }

  function apply(theme) {
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#121214' : '#faf9f7');
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀' : '☾';
  }

  var saved = stored();
  if (saved) root.setAttribute('data-theme', saved);

  document.addEventListener('DOMContentLoaded', function () {
    apply(current());
    var btn = document.getElementById('themeToggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        apply(next);
        save(next);
      });
    }

    /* ---------- スクロールに合わせた表示 ---------- */
    var targets = document.querySelectorAll('.reveal');
    document.querySelectorAll('.cards, .areas, .links').forEach(function (group) {
      Array.prototype.forEach.call(group.children, function (el, i) {
        el.style.setProperty('--i', String(i));
      });
    });

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(targets, function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: .1 });
    Array.prototype.forEach.call(targets, function (el) { io.observe(el); });
  });
})();
</script>
</body>
</html>
