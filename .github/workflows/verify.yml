name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 設定と生成物 23 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存パッケージなし。npm install は要らない。
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - name: 生成
        run: node build.js
      - name: 設定と生成物
        run: node verification/check_build.js
